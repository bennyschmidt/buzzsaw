<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzzsaw</title>
    <link href="./css/styles.css" rel="stylesheet">
    <link href="./font/lucide/lucide.css" rel="stylesheet">
  </head>
  <body>
    <main class="main-content">
      <header class="config-bar">
        <input id="file-upload" type="file" accept=".html,text/html" hidden>
        <input type="file" id="folder-picker" webkitdirectory directory multiple hidden>
        <button class="config-button" type="button" title="Back" aria-label="Back" onclick="console.log('clicked back')">
          <i class="icon icon-arrow-left"></i>
        </button>
        <button class="config-button" type="button" title="Forward" aria-label="Forward" onclick="console.log('clicked forward')">
          <i class="icon icon-arrow-right"></i>
        </button>
        <button class="config-button" type="button" title="Forward" aria-label="Forward" onclick="console.log('clicked search')">
          <i class="icon icon-search"></i>
        </button>
        <input id="current-file-input" type="text" value="file://js/buzzword/agent.glyph" readonly aria-label="Current file">
        <button class="config-button" type="button" title="New file" aria-label="New file" onclick="document.getElementById('file-upload').click()">
          <i class="icon icon-file-plus"></i>
        </button>
        <label for="modelSelect">MODEL:</label>
        <select class="config-bar-select" id="modelSelect"></select>
        <button class="config-button" type="button" title="Configure model" aria-label="Configure model" onclick="document.getElementById('configModal').classList.add('active')">
          <i class="icon icon-settings"></i>
        </button>
        <label for="embeddingSelect">EMBEDDING MODEL:</label>
        <select class="config-bar-select" id="embeddingSelect"></select>
        <button class="config-button" type="button" title="Select bucket" aria-label="Select bucket" onclick="document.getElementById('folder-picker').click()">
          <i class="icon icon-folder-sync"></i>
        </button>
      </header>
      <section class="agent">
        <div class="workflow">
          <div class="workflow-header">
            <div class="workflow-title" id="workflow-title-display">Tasks</div>
            <div class="workflow-tabs">
              <div class="tab active">agent.glyph</div>
            </div>
          </div>
          <ul class="tasklist" id="main-tasklist"></ul>
          <div class="toolchain" id="main-toolchain"></div>
        </div>
      </section>
    </main>
    <div class="modal" id="configModal" role="dialog" aria-modal="true" aria-labelledby="configTitle">
      <div class="modal-content">
        <div class="modal-header" id="configTitle">Configuration: Model (<span id="modal-model-name">DEFAULT_MODEL</span>)</div>
        <div class="modal-body">
          <div class="form-group">
            <label for="modelBaseUrl">MODEL_BASE_URL</label>
            <input id="modelBaseUrl" type="text" value="http://localhost:11434">
          </div>
          <div class="form-group">
            <label>Modelfile Parameters</label>
          </div>
          <div class="form-group">
            <label for="temperature">Temperature</label>
            <input id="temperature" type="range" min="0" max="1" step="0.1" value="0.7">
            <span style="float: right; font-size: 0.75rem; color: hsl(var(--muted-foreground));">0.7</span>
          </div>
          <div class="form-group">
            <label for="topK">Top_K</label>
            <input id="topK" type="number" value="40">
          </div>
        </div>
        <div class="modal-footer">
          <button class="save-button" type="button" onclick="document.getElementById('configModal').classList.remove('active')">
            Save
          </button>
          <button class="cancel-button" type="button" onclick="document.getElementById('configModal').classList.remove('active')">
            Cancel
          </button>
        </div>
      </div>
    </div>
    <script>
      async function loadAgentFile () {
        try {
          const response = await fetch('./js/buzzword/agent.glyph');

          if (!response.ok) {
            throw new Error('File fetch response error.');
          }

          const text = await response.text();

          const parsedData = parseAgentFile(text);

          render(parsedData);
        } catch (error) {
          console.error('Error fetching or updating data from agent.glyph:', error);
        }
      }

      function parseAgentFile (text) {
        const cleanText = text.replace(/\/\/.*\$/gm, '');

        const data = {
          model: '',
          embedModel: '',
          tasklistTitle: 'Tasks',
          tools: [],
          tasks: []
        };

        const modelMatch = cleanText.match(/\[model\]\s*:\s*"([^"]+)"/);
        const embedMatch = cleanText.match(/\[embedModel\]\s*:\s*"([^"]+)"/);
        const titleMatch = cleanText.match(/tasklist\s+"([^"]+)"/);

        if (modelMatch) {
          data.model = modelMatch[1];
        }

        if (embedMatch) {
          data.embedModel = embedMatch[1];
        }

        if (titleMatch) {
          data.tasklistTitle = titleMatch[1];
        }

        const toolchainBlock = cleanText.match(/toolchain[\s\S]*?\{([\s\S]*?)\}/);

        if (toolchainBlock) {
          const toolRegex = /<([a-zA-Z0-9_-]+)\s*\/>/g;

          let match;

          while ((match = toolRegex.exec(toolchainBlock[1])) !== null) {
            data.tools.push(match[1]);
          }
        }

        const tasklistBlock = cleanText.match(/tasklist[\s\S]*?\{([\s\S]*?)\}/);

        if (tasklistBlock) {
          const taskRegex = /<task\s*(completed|active)?\s*"\s*([^"]+)"\s*(?:\/|>\s*([\s\S]*?)\s*<\/task)>/g;

          let match;

          while ((match = taskRegex.exec(tasklistBlock[1])) !== null) {
            let status = match[1] || 'pending';
            let name = match[2];
            let subtext = '';

            if (match[3]) {
              subtext = match[3].replace(/"/g, '').trim();
            }

            data.tasks.push({ name, status, subtext });
          }
        }

        return data;
      }

      function render (data) {
        console.log(data)
        if (data.model) {
          document.getElementById('modelSelect').innerHTML = `<option value="${data.model}">${data.model}</option>`;
          document.getElementById('modal-model-name').textContent = data.model;
        }

        if (data.embedModel) {
          document.getElementById('embeddingSelect').innerHTML = `<option value="${data.embedModel}">${data.embedModel}</option>`;
        }

        if (data.tasklistTitle) {
          document.getElementById('workflow-title-display').textContent = data.tasklistTitle;
        }

        const tasklistUl = document.getElementById('main-tasklist');

        tasklistUl.innerHTML = data.tasks.map(task => {
          let innerContent = `<span>${task.name}</span>`;

          if (task.status === 'active') {
            innerContent = `<span><strong>${task.name}</strong><em class="prompt-status">In progress...</em></span>`;
          }

          if (task.subtext) {
            innerContent += `<div class="tool-details">${task.subtext}</div>`;
          }

          return `<li class="${task.status}">${innerContent}</li>`;
        }).join('');

        const toolchainDiv = document.getElementById('main-toolchain');

        if (data.tools.length > 0) {
          let toolchainHtml = `<div class="toolchain-header">Toolchain</div>`;

          toolchainHtml += data.tools.map((tool, idx) => {
            const isActive = idx === 0 ? 'active' : '';

            return `<div class="toolchain-item ${isActive}">${tool}<p>${!isActive ? '' : '<em class="prompt-status"><span class="spinner"></span><span>Working...</span></em>'}</p></div>`;
          }).join('');

          toolchainDiv.innerHTML = toolchainHtml;
        } else {
          toolchainDiv.innerHTML = '';
        }
      }

      loadAgentFile();
      setInterval(loadAgentFile, 1000);
    </script>
  </body>
</html>
